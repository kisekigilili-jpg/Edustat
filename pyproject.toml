[project]
name = "student-marks"
version = "0.1.0"
description = "A teacher-facing student marks and assessment tracker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1,<4.0",
    "openpyxl>=3.1,<4.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
]

[tool.uv]
package = false
