{% extends "base.html" %}
{% block title %}Password settings{% endblock %}
{% block content %}
<section class="settings-wrap">
    <div class="eyebrow">ACCOUNT SETTINGS</div>
    <h1>Change password</h1>
    <p class="muted">Choose a password with at least 12 characters.</p>
    {% if message %}<div class="notice success" role="status">{{ message }}</div>{% endif %}
    {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
    <form action="/settings/password" method="post" class="card form-stack">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label>
        <label>New password<input name="new_password" type="password" minlength="12" autocomplete="new-password" required></label>
        <label>Confirm new password<input name="confirm_password" type="password" minlength="12" autocomplete="new-password" required></label>
        <button type="submit" class="button primary">Update password</button>
    </form>
</section>
{% endblock %}
