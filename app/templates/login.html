{% extends "base.html" %}
{% block title %}Teacher sign in{% endblock %}
{% block content %}
<section class="login-wrap">
    <div class="eyebrow">TEACHER ACCESS</div>
    <h1>Welcome back.</h1>
    <p class="muted">Sign in to manage your students and marks.</p>
    {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
    <form action="/login" method="post" class="card form-stack">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label>Username<input name="username" autocomplete="username" required autofocus></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit" class="button primary full-width">Sign in</button>
    </form>
</section>
{% endblock %}
